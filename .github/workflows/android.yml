name: android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Also validates gradle-wrapper.jar against the official checksums.
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint and debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace \
            :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug 2>&1 | tee build.log

      # Logs are not always at hand (API clients, mobile): surface the failure as an annotation.
      - name: Summarize failure
        if: failure()
        shell: bash
        run: |
          {
            # Every lint error, not just the first one Gradle prints.
            [ -f app/build/reports/lint-results-debug.txt ] && grep -A2 ': Error: ' app/build/reports/lint-results-debug.txt
            grep -E '^e: |error:|What went wrong|> Task .*FAILED' -A4 build.log || true
            for f in app/build/test-results/testDebugUnitTest/*.xml core/build/test-results/test/*.xml; do
              [ -f "$f" ] && grep -B1 -A3 '<failure' "$f" || true
            done
          } | head -c 6000 > failure.txt
          msg=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' failure.txt | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Android build failed::${msg}"

      - name: Test summary
        if: always()
        shell: bash
        run: |
          total=0; failed=0
          for f in app/build/test-results/testDebugUnitTest/*.xml core/build/test-results/test/*.xml; do
            [ -f "$f" ] || continue
            t=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | tr -dc 0-9); total=$((total + t))
            x=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | tr -dc 0-9); failed=$((failed + x))
          done
          echo "::notice title=Unit tests::${total} tests, ${failed} failed"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pharmatrace-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            core/build/reports/
            build.log
          if-no-files-found: ignore

  # Renders every screen with sample data (Paparazzi, no emulator) and publishes the PNGs on the
  # `screenshots` branch, one folder per source branch, so they can be looked at without
  # downloading artifacts and linked from the README.
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Record screenshots
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:recordPaparazziDebug 2>&1 | tee shots.log

      - name: Summarize failure
        if: failure()
        shell: bash
        run: |
          { grep -E '^e: |error:|What went wrong|FAILED|Exception' -A4 shots.log || true; } | head -c 6000 > failure.txt
          msg=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' failure.txt | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Screenshots failed::${msg}"

      - name: Publish on the screenshots branch
        shell: bash
        env:
          SOURCE: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          src="$PWD/app/src/test/snapshots/images"
          ls "$src"/*.png >/dev/null
          dir="${SOURCE//\//-}"
          work=$(mktemp -d)
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin screenshots >/dev/null; then
            git clone --quiet --depth 1 --branch screenshots "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$work"
          else
            git init --quiet "$work"
            git -C "$work" checkout --quiet --orphan screenshots
            git -C "$work" remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          fi
          rm -rf "$work/$dir"
          mkdir -p "$work/$dir"
          # Paparazzi names files <package>_<class>_<name>.png; keep just the name.
          for f in "$src"/*.png; do
            cp "$f" "$work/$dir/$(basename "$f" | sed -E 's/^.*_ScreenshotTest_//')"
          done
          cd "$work"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit --quiet -m "Screenshots of ${SOURCE} at ${SHA::7}"
          git push --quiet origin screenshots
          n=$(ls "$dir" | wc -l)
          echo "::notice title=Screenshots::${n} images in ${{ github.server_url }}/${{ github.repository }}/tree/screenshots/${dir}"
